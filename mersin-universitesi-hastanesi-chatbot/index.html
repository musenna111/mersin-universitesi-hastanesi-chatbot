<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mersin Üniversitesi Hastanesi Chatbotu</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="chatbot">
    <div class="chatbot-header">
      <div class="header-title">Mersin Üniversitesi Hastanesi Chatbotu</div>
    </div>

    <div id="chat-area" class="chat-area"></div>

    <div class="chatbot-input">
      <input id="userInput" type="text" placeholder="Mesajınızı yazın..." />
      <button id="sendBtn" type="button">Gönder</button>
    </div>
  </div>

  <!-- JS -->
  <script src="js/chatbot.js"></script>
</body>
</html>
